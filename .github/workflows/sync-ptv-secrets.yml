name: Sync PTV secrets to Cloudflare Pages

# One-shot, manual-only. Copies the PTV_DEV_ID / PTV_API_KEY repo secrets into the
# ptv-live-maps Cloudflare Pages project as encrypted secrets, so the /api/departures
# and /api/disruptions Functions can sign PTV requests server-side.
#
# The values are piped from stdin into wrangler and never printed; GitHub also masks
# registered secret values in logs. Run this whenever the PTV credentials change,
# then re-run "Deploy to Cloudflare Pages" so the new secrets bind to a fresh deploy.

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Push PTV_DEV_ID to Pages
        run: printf '%s' "$PTV_DEV_ID" | npx wrangler@3 pages secret put PTV_DEV_ID --project-name=ptv-live-maps
        env:
          PTV_DEV_ID: ${{ secrets.PTV_DEV_ID }}

      - name: Push PTV_API_KEY to Pages
        run: printf '%s' "$PTV_API_KEY" | npx wrangler@3 pages secret put PTV_API_KEY --project-name=ptv-live-maps
        env:
          PTV_API_KEY: ${{ secrets.PTV_API_KEY }}
